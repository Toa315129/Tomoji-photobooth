<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>TOMOJI STUDIO | PHOTOBOOTH</title>
    
    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* TOMOJI Aesthetic Palette */
            --bg-paper: #F8F6F0;
            --surface: #FFFFFF;
            --ink-primary: #4A3E31;
            --ink-secondary: #8C7B68;
            --ink-light: #C4B9A9;
            --accent-blue: #7A9CC6;
            --accent-warm: #D4AF37;
            --border-color: rgba(74, 62, 49, 0.12);
            
            --radius-xl: 28px;
            --radius-lg: 20px;
            --radius-md: 14px;
            
            --shadow-soft: 0 10px 30px rgba(74, 62, 49, 0.06);
            --shadow-hover: 0 16px 40px rgba(74, 62, 49, 0.12);
            
            --font-head: 'Amatic SC', cursive;
            --font-body: 'Plus Jakarta Sans', 'Quicksand', sans-serif;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-paper);
            color: var(--ink-primary);
            height: 100vh; height: 100dvh; width: 100vw;
            overflow: hidden;
            font-family: var(--font-body);
            display: flex; justify-content: center; align-items: center;
        }

        /* Paper texture background */
        .paper-bg {
            position: absolute; inset: 0; z-index: -1;
            background-color: var(--bg-paper);
            background-image: radial-gradient(rgba(140, 123, 104, 0.08) 1px, transparent 0);
            background-size: 24px 24px;
        }

        .screen {
            position: absolute; inset: 0;
            display: flex; flex-direction: column;
            opacity: 0; pointer-events: none;
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 10; padding: 24px;
        }
        .screen.active { opacity: 1; pointer-events: auto; }

        .bento-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-soft);
            transition: all 0.3s ease;
        }

        /* Buttons */
        .btn-start {
            background: var(--ink-primary); color: #FFF; border: none;
            padding: 18px 56px; font-family: var(--font-head); font-size: 2.8rem;
            border-radius: 100px; cursor: pointer;
            box-shadow: 0 8px 20px rgba(74, 62, 49, 0.25);
            transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
            display: inline-flex; align-items: center; gap: 12px;
        }
        .btn-start:hover { transform: translateY(-2px); background: #382E24; box-shadow: 0 12px 28px rgba(74, 62, 49, 0.3); }
        .btn-start:active { transform: translateY(1px); }

        .btn-action {
            background: var(--surface); border: 1.5px solid var(--border-color);
            color: var(--ink-primary); width: 100%; padding: 14px 20px;
            border-radius: var(--radius-md); font-family: var(--font-body);
            font-weight: 600; font-size: 0.95rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: all 0.2s ease;
        }
        .btn-action:hover { background: #FAF8F5; border-color: var(--ink-secondary); transform: translateY(-1px); }
        .btn-action:active { transform: translateY(0); }
        
        .btn-primary-action { background: var(--ink-primary); color: #FFF; border: none; }
        .btn-primary-action:hover { background: #382E24; color: #FFF; }

        .btn-thermal { background: #2A241E; color: #FFF; border: none; }
        .btn-thermal:hover { background: #1A1613; color: #FFF; }

        /* Screen 1: Home */
        #screen-home { justify-content: center; align-items: center; text-align: center; }
        .main-logo { width: 260px; max-width: 80%; height: auto; margin-bottom: 24px; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-10px);} }
        .logo-text { font-family: var(--font-head); font-size: 5rem; color: var(--ink-primary); line-height: 1; margin-bottom: 8px; }
        .tagline { color: var(--ink-secondary); font-size: 1.1rem; letter-spacing: 2px; text-transform: uppercase; margin-top: 16px; font-weight: 600; }

        /* Screen 1.5: Frame Select */
        #screen-select-frame { align-items: center; padding-top: 40px; overflow-y: auto; }
        .page-title { font-family: var(--font-head); font-size: 3.8rem; color: var(--ink-primary); line-height: 1; }
        .page-sub { color: var(--ink-secondary); font-size: 1rem; margin-bottom: 32px; }

        .frame-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px; width: 100%; max-width: 900px; padding: 10px;
        }
        .frame-card {
            cursor: pointer; padding: 16px; text-align: center;
            display: flex; flex-direction: column; align-items: center;
        }
        .frame-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-hover); border-color: var(--ink-secondary); }
        .frame-card img {
            width: 100%; height: auto; aspect-ratio: 2/3; object-fit: contain;
            border-radius: 8px; border: 1px dashed var(--ink-light);
            background: #FAFAFA; margin-bottom: 12px;
        }
        .frame-label { font-family: var(--font-head); font-size: 1.8rem; color: var(--ink-primary); }

        /* Screen 2: Camera */
        #screen-cam { padding: 16px; justify-content: center; }
        .cam-container {
            position: relative; width: 100%; height: 100%; max-width: 1100px;
            border-radius: var(--radius-xl); overflow: hidden; background: #1C1815;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3); display: flex; flex-direction: column;
        }

        .ui-top {
            position: absolute; top: 0; left: 0; right: 0; padding: 20px 28px;
            display: flex; justify-content: space-between; align-items: center; z-index: 20;
            color: #FFF; font-weight: 600; font-size: 0.95rem;
            background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, transparent 100%);
        }
        .rec-dot { display: inline-block; width: 10px; height: 10px; background: #EF4444; border-radius: 50%; margin-right: 8px; animation: blink 1.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .viewport {
            flex: 1; position: relative; overflow: hidden;
            display: flex; justify-content: center; align-items: center; width: 100%;
        }

        .cam-box {
            position: relative; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }
        video#video-feed { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        #cam-frame-overlay { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; z-index: 15; }

        /* Sidebar Tools */
        .cam-sidebar {
            position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 14px; z-index: 30;
        }
        .tool-icon {
            width: 48px; height: 48px; background: rgba(0,0,0,0.4); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; color: #FFF;
            font-size: 1.1rem; cursor: pointer; backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.25); transition: all 0.2s;
        }
        .tool-icon:hover { background: rgba(0,0,0,0.6); transform: scale(1.05); }
        .tool-icon:active { transform: scale(0.95); }

        #countdown {
            position: absolute; font-family: var(--font-head); font-size: 13rem; color: #FFF;
            display: none; z-index: 100; text-shadow: 0 8px 24px rgba(0,0,0,0.6); line-height: 1;
        }

        .ui-bottom {
            padding: 24px; background: linear-gradient(0deg, rgba(0,0,0,0.85) 0%, transparent 100%);
            display: flex; flex-direction: column; align-items: center; z-index: 20;
        }

        .filter-select {
            display: flex; gap: 10px; margin-bottom: 18px;
            background: rgba(255,255,255,0.15); padding: 6px 12px; border-radius: 100px;
            backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.2);
        }
        .f-item {
            padding: 6px 14px; font-size: 0.85rem; color: rgba(255,255,255,0.75);
            cursor: pointer; font-weight: 600; border-radius: 100px; transition: all 0.2s;
        }
        .f-item.active { background: #FFF; color: var(--ink-primary); }

        .shutter-outer {
            width: 76px; height: 76px; border-radius: 50%; border: 4px solid #FFF;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: transform 0.2s; background: transparent;
        }
        .shutter-inner { width: 60px; height: 60px; background: #FFF; border-radius: 50%; }
        .shutter-outer:active { transform: scale(0.92); }

        /* Screen 3: Result */
        #screen-result { flex-direction: row; gap: 24px; justify-content: center; align-items: stretch; max-width: 1100px; margin: 0 auto; }
        
        .preview-area {
            flex: 1; display: flex; justify-content: center; align-items: center;
            padding: 24px; border-radius: var(--radius-xl); background: var(--surface);
            border: 1px solid var(--border-color); box-shadow: var(--shadow-soft);
        }
        .preview-img {
            max-height: 80vh; max-width: 100%; object-fit: contain;
            box-shadow: 0 12px 32px rgba(74, 62, 49, 0.15); border-radius: 4px;
        }

        .control-panel {
            width: 360px; display: flex; flex-direction: column; gap: 16px;
        }

        .result-head { font-family: var(--font-head); font-size: 3rem; color: var(--ink-primary); line-height: 1; }

        .qr-card {
            padding: 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px;
        }
        #qr-box { padding: 12px; background: #FFF; border: 2px dashed var(--ink-light); border-radius: var(--radius-md); display: none; }

        .actions-card { padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .actions-card hr { border: 0; border-top: 1px dashed var(--border-color); margin: 6px 0; }

        #flash { position: fixed; inset: 0; background: #FFF; z-index: 999; opacity: 0; pointer-events: none; transition: opacity 0.12s; }

        #print-only-img { display: none; }
        @media print {
            body { visibility: hidden; background: white; margin: 0; }
            .screen, .paper-bg { display: none !important; }
            #print-only-img {
                display: block !important; visibility: visible !important;
                position: fixed; top: 0; left: 0; z-index: 9999;
            }
        }

        /* Responsive Mobile */
        @media (max-width: 900px) {
            #screen-result { flex-direction: column; overflow-y: auto; }
            .preview-area { min-height: 50vh; }
            .control-panel { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="paper-bg"></div>

    <div id="screen-home" class="screen active">
        <img src="logo.png" class="main-logo" alt="Tomoji Studio" onerror="this.style.display='none'; document.querySelector('.logo-text').style.display='block'">
        <div class="logo-text" style="display:none;">TOMOJI STUDIO</div>
        <button class="btn-start" onclick="OS.goToFrameSelect()">
            START
        </button>
        <div class="tagline">Capture Your Natural Moment</div>
    </div>

    <div id="screen-select-frame" class="screen">
        <div class="page-title">Pick Your Frame</div>
        <div class="page-sub">Choose your favorite style</div>
        
        <div class="frame-grid">
            <div class="bento-card frame-card" onclick="OS.selectFrame('frame1.png')">
                <img src="frame1.png" alt="Style 1" onerror="this.src='https://placehold.co/400x600/f0ede6/5d4e3e?text=Style+01'">
                <div class="frame-label">Style 01</div>
            </div>
            <div class="bento-card frame-card" onclick="OS.selectFrame('frame2.png')">
                <img src="frame2.png" alt="Style 2" onerror="this.src='https://placehold.co/400x600/f0ede6/5d4e3e?text=Style+02'">
                <div class="frame-label">Style 02</div>
            </div>
            <div class="bento-card frame-card" onclick="OS.selectFrame('frame3.png')">
                <img src="frame3.png" alt="Style 3" onerror="this.src='https://placehold.co/400x600/f0ede6/5d4e3e?text=Style+03'">
                <div class="frame-label">Style 03</div>
            </div>
            <div class="bento-card frame-card" onclick="OS.selectFrame('frame4.png', 1, 'bw')">
                <img src="frame4.png" alt="Style 4" onerror="this.src='https://placehold.co/400x565/f0ede6/5d4e3e?text=Style+04+(A4)'">
                <div class="frame-label">Style 04</div>
            </div>
        </div>

        <button class="btn-action" style="max-width: 180px; margin-top: 24px;" onclick="OS.restart()">Back to Home</button>
    </div>

    <div id="screen-cam" class="screen">
        <div class="cam-container">
            <div class="ui-top">
                <span><span class="rec-dot"></span>REC</span>
                <span id="clock">00:00</span>
            </div>

            <div class="viewport">
                <div class="cam-box">
                    <video id="video-feed" autoplay playsinline muted></video>
                    <img id="cam-frame-overlay" alt="Live Overlay" style="display:none;">
                </div>

                <div id="countdown">3</div>
                
                <div class="cam-sidebar">
                    <div class="tool-icon" onclick="OS.toggleCamFlip()" title="Flip Camera">↺</div>
                    <div class="tool-icon" onclick="OS.toggleTimer()" id="btn-timer" style="font-weight:700;">3s</div>
                    <div class="tool-icon" onclick="OS.toggleFlash()" title="Flash">⚡</div>
                    <div class="tool-icon" onclick="OS.toggleMirror()" title="Mirror">⇄</div>
                </div>
            </div>

            <div class="ui-bottom">
                <div class="filter-select">
                    <div class="f-item active" onclick="OS.filter('normal', this)">Original</div>
                    <div class="f-item" onclick="OS.filter('soft', this)">Soft</div>
                    <div class="f-item" onclick="OS.filter('bw', this)">Mono</div>
                    <div class="f-item" onclick="OS.filter('warm', this)">Warm</div>
                </div>
                <div class="shutter-outer" onclick="OS.snap()">
                    <div class="shutter-inner"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="screen-result" class="screen">
        <div class="preview-area">
            <img id="final-img" class="preview-img" alt="Result">
        </div>

        <div class="control-panel">
            <div class="bento-card qr-card">
                <div class="result-head">Tomoji Studio</div>
                <div id="qr-box">
                    <div id="qrcode"></div>
                </div>
                <span id="log-text" style="font-size:0.85rem; color:var(--ink-secondary); font-weight: 500;">Processing...</span>
            </div>

            <div class="bento-card actions-card">
                <!-- Dual Print System Buttons -->
                <button class="btn-action btn-primary-action" onclick="OS.printPhoto('normal')">
                    🖨️ Print Photo (4x6 Color)
                </button>
                <button class="btn-action btn-thermal" onclick="OS.printPhoto('receipt')">
                    🧾 Print Receipt (Thermal B&W)
                </button>
                
                <hr>

                <button class="btn-action" onclick="OS.download()">📥 Save Image (JPG)</button>
                <button class="btn-action" onclick="OS.downloadVideo()">🎥 Save Moment (Video)</button>
                
                <hr>

                <button class="btn-action" onclick="OS.restart()" style="border:none; color:var(--ink-secondary);">Take New Photo</button>
            </div>
        </div>
    </div>

    <div id="flash"></div>
    <img id="print-only-img" src="" alt="Print">
    <canvas id="hidden-canvas" style="display:none;"></canvas>

    <script>
        const OS = (function() {
            // Configuration & ImgBB Key
            const API_KEY = 'ffc90ad0bc5c7e0c056b68ef7430304a';
            const C = { 
                stripW: 1200, 
                shots: 3, 
                gap: 35, 
                topMargin: 250, 
                btmMargin: 150 
            };
            
            let s = { 
                filter: 'normal', 
                frameImg: null, 
                photos: [], 
                stream: null, 
                processing: false, 
                timer: 3, 
                flash: true, 
                facingMode: 'user', 
                mirror: true 
            };

            const D = {
                screens: { 
                    home: document.getElementById('screen-home'), 
                    select: document.getElementById('screen-select-frame'), 
                    cam: document.getElementById('screen-cam'), 
                    res: document.getElementById('screen-result') 
                },
                video: document.getElementById('video-feed'), 
                canvas: document.getElementById('hidden-canvas'), 
                count: document.getElementById('countdown'), 
                flash: document.getElementById('flash'), 
                final: document.getElementById('final-img'), 
                btnTimer: document.getElementById('btn-timer'), 
                printImg: document.getElementById('print-only-img'), 
                camOverlay: document.getElementById('cam-frame-overlay'), 
                camBox: document.querySelector('.cam-box')
            };

            const Aud = {
                ctx: null,
                init: function() { if(!this.ctx) this.ctx = new (window.AudioContext||window.webkitAudioContext)(); },
                play: function(type) {
                    this.init(); if(this.ctx.state === 'suspended') this.ctx.resume();
                    const o = this.ctx.createOscillator(); const g = this.ctx.createGain();
                    o.connect(g); g.connect(this.ctx.destination);
                    const t = this.ctx.currentTime;
                    if(type === 'shutter') {
                        const n = this.ctx.createBufferSource(); 
                        const b = this.ctx.createBuffer(1, this.ctx.sampleRate*0.1, this.ctx.sampleRate);
                        const d = b.getChannelData(0); 
                        for(let i=0;i<b.length;i++) d[i]=Math.random()*2-1;
                        n.buffer=b; n.connect(g); g.gain.value=0.3; n.start(t);
                    } else {
                        o.frequency.value = 800; g.gain.value = 0.1; 
                        o.start(t); o.stop(t+0.1);
                    }
                }
            };

            function switchScreen(name) { 
                Object.values(D.screens).forEach(s => s.classList.remove('active')); 
                D.screens[name].classList.add('active'); 
            }

            function goToFrameSelect() { switchScreen('select'); }

            function selectFrame(url, customShots = 3, forceFilter = null) {
                C.shots = customShots;
                const img = new Image();
                img.crossOrigin = "Anonymous";
                img.src = url;
                img.onload = () => { 
                    s.frameImg = img; 
                    if (D.camOverlay && D.camBox) {
                        if (customShots === 1) {
                            D.camOverlay.src = url;
                            D.camOverlay.style.display = 'block';
                            D.camBox.style.aspectRatio = `${img.width} / ${img.height}`;
                        } else {
                            D.camOverlay.style.display = 'none';
                            D.camBox.style.aspectRatio = 'unset';
                        }
                    }
                    startCam(); 
                    setTimeout(() => {
                        const btns = document.querySelectorAll('.f-item');
                        if (forceFilter === 'bw') {
                            filter('bw', btns[2]);
                        } else {
                            filter('normal', btns[0]);
                        }
                    }, 500);
                };
                img.onerror = () => { 
                    s.frameImg = null; 
                    if (D.camOverlay) D.camOverlay.style.display = 'none';
                    if (D.camBox) D.camBox.style.aspectRatio = 'unset';
                    startCam(); 
                };
            }

            async function startCam() {
                try {
                    s.stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: s.facingMode, width: {ideal: 1920}, height: {ideal: 1080} }, 
                        audio: false 
                    });
                    D.video.srcObject = s.stream; 
                    updateMirror();
                    switchScreen('cam');
                    startClock();
                } catch(e) { alert("Camera Error: Please allow camera access."); }
            }

            function startClock() {
                setInterval(() => { 
                    const d = new Date(); 
                    document.getElementById('clock').innerText = 
                        d.getHours().toString().padStart(2,'0')+":"+d.getMinutes().toString().padStart(2,'0'); 
                }, 1000);
            }

            function toggleCamFlip() { s.facingMode = (s.facingMode === 'user') ? 'environment' : 'user'; s.stream.getTracks().forEach(t=>t.stop()); startCam(); }
            function toggleTimer() { const timers = [3, 5, 10]; s.timer = timers[(timers.indexOf(s.timer)+1) % timers.length]; D.btnTimer.innerText = s.timer + "s"; }
            function toggleFlash() { s.flash = !s.flash; document.querySelector('.tool-icon:nth-child(3)').style.opacity = s.flash?1:0.3; }
            function toggleMirror() { s.mirror = !s.mirror; updateMirror(); }
            function updateMirror() { D.video.style.transform = s.mirror ? "scaleX(-1)" : "scaleX(1)"; }

            function filter(mode, btn) {
                s.filter = mode; 
                document.querySelectorAll('.f-item').forEach(b => b.classList.remove('active')); 
                if (btn) btn.classList.add('active');
                let css = 'none';
                if(mode==='soft') css = 'contrast(0.9) brightness(1.1) saturate(0.9)';
                if(mode==='bw') css = 'grayscale(100%) contrast(1.1)';
                if(mode==='warm') css = 'sepia(0.3) contrast(1.05) saturate(0.9)';
                D.video.style.filter = css;
            }

            async function snap() {
                if(s.processing) return; s.processing = true; s.photos = [];
                for(let i=0; i<C.shots; i++) { 
                    await countdown(s.timer); 
                    await capture(); 
                    if (i < C.shots - 1) await new Promise(r => setTimeout(r, 800)); 
                }
                processResult();
            }

            function countdown(n) {
                return new Promise(r => {
                    let c = n; D.count.style.display = 'block'; D.count.innerText = c; 
                    Aud.play('beep');
                    const t = setInterval(() => { 
                        c--; 
                        if(c>0) { D.count.innerText = c; Aud.play('beep'); } 
                        else { clearInterval(t); D.count.style.display = 'none'; r(); } 
                    }, 1000);
                });
            }

            function capture() {
                return new Promise(r => {
                    Aud.play('shutter');
                    if(s.flash) { D.flash.style.opacity=1; setTimeout(() => D.flash.style.opacity=0, 150); }
                    
                    const cvs = document.createElement('canvas'); 
                    cvs.width = D.video.videoWidth; cvs.height = D.video.videoHeight;
                    const ctx = cvs.getContext('2d');
                    
                    if(s.mirror) { ctx.translate(cvs.width, 0); ctx.scale(-1, 1); }
                    ctx.drawImage(D.video, 0, 0);
                    
                    if(s.filter !== 'normal') {
                        const id = ctx.getImageData(0,0,cvs.width,cvs.height); const d = id.data;
                        for(let i=0; i<d.length; i+=4) {
                            let R=d[i], G=d[i+1], B=d[i+2];
                            if(s.filter === 'bw') { const v = 0.299*R + 0.587*G + 0.114*B; d[i]=d[i+1]=d[i+2]=v; }
                            else if(s.filter === 'warm') { 
                                d[i] = R*0.393+G*0.769+B*0.189; 
                                d[i+1] = R*0.349+G*0.686+B*0.168; 
                                d[i+2] = R*0.272+G*0.534+B*0.131; 
                            }
                        }
                        ctx.putImageData(id, 0, 0);
                    }
                    s.photos.push(cvs); 
                    setTimeout(r, 200);
                });
            }

            function processResult() {
                generateStripCanvas();
                const finalUrl = D.canvas.toDataURL('image/jpeg', 0.95);
                D.final.src = finalUrl;
                switchScreen('res');
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors:['#5D4E3E', '#8C7B68', '#F8F6F0'] });
                handleUpload(finalUrl);
            }

            function generateStripCanvas(shiftOrder = 0) {
                const stripW = C.stripW; 
                let H;
                if (s.frameImg) {
                    const ratio = s.frameImg.height / s.frameImg.width;
                    H = stripW * ratio;
                } else {
                    const photoW = stripW * 0.85; 
                    const photoH = (photoW * 3) / 4; 
                    H = C.topMargin + (photoH * C.shots) + (C.gap * (C.shots-1)) + C.btmMargin;
                }

                D.canvas.width = stripW; D.canvas.height = H;
                const ctx = D.canvas.getContext('2d');
                ctx.fillStyle = '#F8F6F0'; 
                ctx.fillRect(0,0,stripW,H);

                let displayPhotos = [...s.photos];
                for(let i=0; i<shiftOrder; i++) displayPhotos.unshift(displayPhotos.pop());

                if (C.shots === 1) {
                    // Style 04: Aspect Fill (Cover)
                    if (displayPhotos.length > 0) {
                        const p = displayPhotos[0];
                        const sR = p.width / p.height; 
                        const dR = stripW / H; 
                        let sx, sy, sw, sh;
                        if (sR > dR) {
                            sh = p.height; sw = sh * dR; sx = (p.width - sw) / 2; sy = 0;
                        } else {
                            sw = p.width; sh = sw / dR; sx = 0; sy = (p.height - sh) / 2;
                        }
                        ctx.drawImage(p, sx, sy, sw, sh, 0, 0, stripW, H);
                    }
                } else {
                    // Styles 01, 02, 03: Multi-shot strip
                    const photoW = stripW * 0.85; 
                    const photoH = (photoW * 3) / 4; 
                    const startX = (stripW - photoW) / 2;
                    let currentY = (H - (photoH * C.shots + C.gap * (C.shots - 1))) / 2; 

                    displayPhotos.forEach(p => {
                        const sR = p.width / p.height, dR = 4 / 3;
                        let sx, sy, sw, sh;
                        if(sR > dR) { sh = p.height; sw = sh * dR; sx = (p.width - sw) / 2; sy = 0; } 
                        else { sw = p.width; sh = sw / dR; sx = 0; sy = (p.height - sh) / 2; }
                        ctx.drawImage(p, sx, sy, sw, sh, startX, currentY, photoW, photoH);
                        currentY += photoH + C.gap;
                    });
                }

                if(s.frameImg) {
                    ctx.drawImage(s.frameImg, 0, 0, stripW, H);
                }
            }

            async function handleUpload(base64) {
                const log = document.getElementById('log-text');
                try {
                    const fd = new FormData(); fd.append("image", base64.split(',')[1]); 
                    const res = await fetch(`https://api.imgbb.com/1/upload?key=${API_KEY}`, { method: "POST", body: fd });
                    const data = await res.json();
                    if (data.success) {
                        log.innerText = "Scan QR to Download!";
                        document.getElementById('qrcode').innerHTML = "";
                        new QRCode(document.getElementById("qrcode"), { 
                            text: data.data.url, width: 110, height: 110, 
                            colorDark : "#4A3E31", colorLight : "#FFF" 
                        });
                        document.getElementById('qr-box').style.display = 'block';
                    }
                } catch (err) { log.innerText = "Upload Failed (Save manually)"; }
            }

            function download() { 
                const a = document.createElement('a'); 
                a.download = `TOMOJI_${Date.now()}.jpg`; 
                a.href = D.final.src; 
                a.click(); 
            }

            // DUAL PRINT SYSTEM: Normal Photo vs Thermal Receipt
            function printPhoto(type = 'normal') {
                D.printImg.src = D.final.src;
                
                let printStyle = document.getElementById('dynamic-print-style');
                if(!printStyle) {
                    printStyle = document.createElement('style');
                    printStyle.id = 'dynamic-print-style';
                    document.head.appendChild(printStyle);
                }

                if (type === 'receipt') {
                    // Thermal Receipt Format (80mm width, B&W High-Contrast)
                    printStyle.innerHTML = `
                        @media print {
                            @page { size: 80mm auto; margin: 0; }
                            #print-only-img {
                                width: 100% !important; height: auto !important;
                                max-width: 76mm !important; position: static !important;
                                filter: grayscale(100%) contrast(160%) brightness(1.05) !important;
                                image-rendering: pixelated; margin: 0 auto;
                            }
                        }
                    `;
                } else {
                    // Standard 4x6 Photo Format
                    printStyle.innerHTML = `
                        @media print {
                            @page { size: 4in 6in; margin: 0; }
                            #print-only-img {
                                width: auto !important; height: 100% !important;
                                max-height: 100vh !important; position: fixed !important;
                                top: 0; left: 0; filter: none !important;
                            }
                        }
                    `;
                }

                setTimeout(() => { window.print(); }, 400);
            }

            async function downloadVideo() {
                if(s.processing) return;
                const log = document.getElementById('log-text');
                log.innerText = "Generating Video...";
                try {
                    const stream = D.canvas.captureStream(30);
                    const recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                    const chunks = [];
                    recorder.ondataavailable = e => chunks.push(e.data);
                    recorder.onstop = () => {
                        const blob = new Blob(chunks, { type: 'video/webm' }); 
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a'); a.href = url; 
                        a.download = `TOMOJI_MOMENT_${Date.now()}.webm`; 
                        a.click();
                        generateStripCanvas(0); 
                        D.final.src = D.canvas.toDataURL('image/jpeg', 0.95);
                        log.innerText = "Video Saved!";
                    };
                    
                    recorder.start();
                    
                    let startT = Date.now(); 
                    let shift = 0;
                    const anim = setInterval(() => { 
                        if (Date.now() - startT >= 4000) {
                            clearInterval(anim); recorder.stop(); 
                        } else {
                            if(Date.now() % 500 < 50) { 
                                shift++; generateStripCanvas(shift); 
                            }
                        }
                    }, 33); 
                } catch(e) { alert("Video save not supported on this device/browser."); log.innerText=""; }
            }

            function restart() { location.reload(); }

            return { 
                goToFrameSelect, selectFrame, toggleCamFlip, toggleTimer, 
                toggleFlash, toggleMirror, filter, snap, download, restart, 
                downloadVideo, printPhoto 
            };
        })();
    </script>
